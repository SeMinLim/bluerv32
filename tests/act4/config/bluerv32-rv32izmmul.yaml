# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: bluerv32-rv32izmmul
description: |
  ACT4 DUT configuration for the unprivileged blueRV32 RV32IZmmul core. The
  core implements the I and Zmmul extensions and intentionally excludes the
  division and remainder subset of M, as well as C, Zicsr, and Zifencei.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: Zmmul, version: "= 1.0.0" }

params:
  MXLEN: 32
