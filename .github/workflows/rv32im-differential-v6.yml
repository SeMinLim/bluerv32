name: Temporary RV32IM Differential Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rv32im-differential-v6.yml
      - tests/differential/**

permissions:
  contents: write

concurrency:
  group: bluerv32-rv32im-differential-diagnostics
  cancel-in-progress: true

jobs:
  rv32im-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out blueRV32
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record diagnostic run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > tests/.rv32im-differential-active <<EOF
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add tests/.rv32im-differential-active
          git commit -m 'Record active RV32IM differential diagnostic [skip actions]'
          git push origin HEAD:main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential device-tree-compiler \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf git \
            libboost-program-options-dev libboost-regex-dev \
            libboost-system-dev libgmp-dev pkg-config zlib1g-dev

      - name: Install Bluespec Compiler 2026.01
        run: |
          curl -fsSL \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz \
            -o /tmp/bsc.tar.gz
          echo '6d13db288cf268dc1331f05b277c414b4ff1c1ab9618a6526ba16ad29e484e43  /tmp/bsc.tar.gz' \
            | sha256sum -c -
          mkdir -p "$HOME/bsc"
          tar xzf /tmp/bsc.tar.gz --directory="$HOME/bsc" --strip-components=1
          echo "$HOME/bsc/bin" >> "$GITHUB_PATH"

      - name: Build Spike
        run: |
          git clone --depth 1 \
            https://github.com/riscv-software-src/riscv-isa-sim.git \
            /tmp/riscv-isa-sim
          mkdir -p /tmp/riscv-isa-sim/build "$HOME/riscv"
          cd /tmp/riscv-isa-sim/build
          ../configure --prefix="$HOME/riscv"
          make -j"$(nproc)"
          make install
          echo "$HOME/riscv/bin" >> "$GITHUB_PATH"

      - name: Run RV32IM Spike differential test
        env:
          SPIKE_TIMEOUT: 60
        run: |
          set +e
          set -o pipefail
          timeout 300 make test-differential PROFILE=rv32im \
            2>&1 | tee /tmp/rv32im-differential.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > /tmp/rv32im-differential.status

          build_dir=build/rv32im/tests/rv32im_diff
          for file in core.log spike.log rv32im_diff.dump rv32im_diff.elf \
              rv32im_diff.spike.elf; do
            if [[ -f "${build_dir}/${file}" ]]; then
              cp "${build_dir}/${file}" "/tmp/${file}"
            fi
          done

      - name: Upload differential diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluerv32-rv32im-differential-diagnostics
          path: |
            /tmp/rv32im-differential.log
            /tmp/rv32im-differential.status
            /tmp/core.log
            /tmp/spike.log
            /tmp/rv32im_diff.dump
            /tmp/rv32im_diff.elf
            /tmp/rv32im_diff.spike.elf
          if-no-files-found: warn
          retention-days: 7

      - name: Publish differential diagnostics
        if: always()
        run: |
          status=$(cat /tmp/rv32im-differential.status 2>/dev/null || printf '255')
          core_count=$(grep -c 'RV32_COMMIT ' /tmp/core.log 2>/dev/null || true)
          spike_count=$(grep -Ec '0x[0-9a-fA-F]{8,16}[[:space:]]+\(0x[0-9a-fA-F]{8}\)' \
            /tmp/spike.log 2>/dev/null || true)
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'differential_exit_status=%s\n' "$status"
            printf 'core_trace_count=%s\n' "$core_count"
            printf 'spike_trace_count=%s\n' "$spike_count"
            printf 'spike_commit=%s\n' "$(git -C /tmp/riscv-isa-sim rev-parse HEAD 2>/dev/null || printf unknown)"
            printf '%s\n' '--- CORE TRACE HEAD ---'
            grep 'RV32_COMMIT ' /tmp/core.log 2>/dev/null | head -n 12 || true
            printf '%s\n' '--- CORE TRACE TAIL ---'
            grep 'RV32_COMMIT ' /tmp/core.log 2>/dev/null | tail -n 12 || true
            printf '%s\n' '--- SPIKE LOG HEAD ---'
            head -n 40 /tmp/spike.log 2>/dev/null || true
            printf '%s\n' '--- SPIKE LOG TAIL ---'
            tail -n 40 /tmp/spike.log 2>/dev/null || true
            printf '%s\n' '--- DIFFERENTIAL LOG TAIL ---'
            tail -n 80 /tmp/rv32im-differential.log 2>/dev/null || true
          } > /tmp/rv32im-differential-diagnostics

          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git pull --rebase origin main
          cp /tmp/rv32im-differential-diagnostics tests/.rv32im-differential-diagnostics
          git rm -f tests/.rv32im-differential-active
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/.rv32im-differential-diagnostics
          git commit -m 'Record RV32IM differential diagnostics [skip actions]'
          git push origin HEAD:main

      - name: Return differential status
        if: always()
        run: exit "$(cat /tmp/rv32im-differential.status 2>/dev/null || printf '255')"
