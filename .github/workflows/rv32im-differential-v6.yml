name: Temporary RV32IM Directed and Differential Validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rv32im-differential-v6.yml

permissions:
  contents: write

jobs:
  rv32im-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out blueRV32
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential device-tree-compiler \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf git \
            libboost-program-options-dev libboost-regex-dev \
            libboost-system-dev libgmp-dev pkg-config zlib1g-dev

      - name: Install Bluespec Compiler 2026.01
        run: |
          curl -fsSL \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz \
            -o /tmp/bsc.tar.gz
          echo '6d13db288cf268dc1331f05b277c414b4ff1c1ab9618a6526ba16ad29e484e43  /tmp/bsc.tar.gz' \
            | sha256sum -c -
          mkdir -p "$HOME/bsc"
          tar xzf /tmp/bsc.tar.gz --directory="$HOME/bsc" --strip-components=1
          echo "$HOME/bsc/bin" >> "$GITHUB_PATH"

      - name: Build Spike
        run: |
          git clone --depth 1 \
            https://github.com/riscv-software-src/riscv-isa-sim.git \
            /tmp/riscv-isa-sim
          mkdir -p /tmp/riscv-isa-sim/build "$HOME/riscv"
          cd /tmp/riscv-isa-sim/build
          ../configure --prefix="$HOME/riscv"
          make -j"$(nproc)"
          make install
          echo "$HOME/riscv/bin" >> "$GITHUB_PATH"

      - name: Verify tools and repository
        run: |
          bsc -v
          riscv64-unknown-elf-gcc --version | head -n 1
          riscv64-unknown-elf-objcopy --version | head -n 1
          spike --help >/dev/null
          printf 'Spike commit: '
          git -C /tmp/riscv-isa-sim rev-parse HEAD
          rm -rf .github/workflows
          make lint

      - name: Run RV32IM directed tests
        run: |
          set +e
          set -o pipefail
          timeout 600 make test-directed PROFILE=rv32im \
            2>&1 | tee /tmp/rv32im-directed-final.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > /tmp/rv32im-directed-final.status

      - name: Run RV32IM Spike differential test
        if: always()
        run: |
          set +e
          set -o pipefail
          timeout 300 make test-differential PROFILE=rv32im \
            2>&1 | tee /tmp/rv32im-differential-final.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > /tmp/rv32im-differential-final.status

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluerv32-rv32im-directed-differential-final
          path: |
            /tmp/rv32im-directed-final.log
            /tmp/rv32im-directed-final.status
            /tmp/rv32im-differential-final.log
            /tmp/rv32im-differential-final.status
            build/rv32im/tests
          if-no-files-found: warn
          retention-days: 7

      - name: Publish validation result
        if: always()
        run: |
          directed_status=$(cat /tmp/rv32im-directed-final.status 2>/dev/null || printf '255')
          differential_status=$(cat /tmp/rv32im-differential-final.status 2>/dev/null || printf '255')
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'directed_exit_status=%s\n' "$directed_status"
            printf 'differential_exit_status=%s\n' "$differential_status"
            printf 'spike_commit=%s\n' "$(git -C /tmp/riscv-isa-sim rev-parse HEAD 2>/dev/null || printf unknown)"
            printf '%s\n' '--- DIRECTED LOG ---'
            cat /tmp/rv32im-directed-final.log 2>/dev/null || true
            printf '%s\n' '--- DIFFERENTIAL LOG ---'
            cat /tmp/rv32im-differential-final.log 2>/dev/null || true
          } > /tmp/rv32im-validation-final

          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git pull --rebase origin main
          cp /tmp/rv32im-validation-final tests/.rv32im-validation-final
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/.rv32im-validation-final
          git commit -m 'Record final RV32IM directed and differential result [skip actions]'
          git push origin HEAD:main

      - name: Return validation status
        if: always()
        run: |
          directed_status=$(cat /tmp/rv32im-directed-final.status 2>/dev/null || printf '255')
          differential_status=$(cat /tmp/rv32im-differential-final.status 2>/dev/null || printf '255')
          if [[ "$directed_status" -ne 0 || "$differential_status" -ne 0 ]]; then
            exit 1
          fi
