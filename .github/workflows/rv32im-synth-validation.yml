name: Temporary RV32IM ULX3S Synthesis Validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rv32im-synth-validation.yml

permissions:
  contents: read

jobs:
  synth-rv32im-ulx3s:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: 787d271b4263829b618d57b170909db983396ae1
          fetch-depth: 1

      - name: Install FPGA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            fpga-trellis \
            fpga-trellis-database \
            libgmp10 \
            nextpnr-ecp5 \
            nextpnr-ecp5-chipdb \
            yosys

      - name: Install Bluespec Compiler 2026.01
        run: |
          curl -fsSL \
            https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz \
            -o /tmp/bsc.tar.gz
          echo '6d13db288cf268dc1331f05b277c414b4ff1c1ab9618a6526ba16ad29e484e43  /tmp/bsc.tar.gz' \
            | sha256sum -c -
          mkdir -p "$HOME/bsc"
          tar xzf /tmp/bsc.tar.gz --directory="$HOME/bsc" --strip-components=1
          echo "$HOME/bsc/bin" >> "$GITHUB_PATH"

      - name: Record tool versions
        run: |
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf '%s\n' '--- BSC ---'
            bsc -v
            printf '%s\n' '--- Yosys ---'
            yosys -V
            printf '%s\n' '--- nextpnr-ecp5 ---'
            nextpnr-ecp5 --version
            printf '%s\n' '--- Ubuntu packages ---'
            dpkg-query -W \
              -f='${Package}=${Version}\n' \
              fpga-trellis fpga-trellis-database \
              nextpnr-ecp5 nextpnr-ecp5-chipdb yosys
          } | tee /tmp/rv32im-synth-versions.txt
          command -v ecppack

      - name: Run RV32IM ULX3S synthesis
        run: |
          set -o pipefail
          make synth PROFILE=rv32im BOARD=ulx3s \
            2>&1 | tee /tmp/rv32im-synth.log

      - name: Upload synthesis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluerv32-rv32im-ulx3s-synthesis
          path: |
            /tmp/rv32im-synth.log
            /tmp/rv32im-synth-versions.txt
            build/rv32im/hardware
          if-no-files-found: warn
          retention-days: 7
